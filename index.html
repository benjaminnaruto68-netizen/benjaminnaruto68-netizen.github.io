<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogeub</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            margin: 0;
            background:
                radial-gradient(circle at 50% 20%, rgba(45, 57, 90, 0.25), transparent 40%),
                #0b1220;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* Subtle background texture */
        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            background-image:
                radial-gradient(#64748b 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .app-button {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all .2s ease;
            background: #202b3d;
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
        }

        .app-button:hover {
            transform: translateY(-4px) scale(1.06);
            background: #2b374c;
            box-shadow: 0 8px 25px rgba(0,0,0,.4);
        }

        .search-box {
            background: #172235;
            border: 1px solid #26344a;
            box-shadow: 0 8px 30px rgba(0,0,0,.25);
        }

        .search-box:focus-within {
            border-color: #475a78;
            box-shadow: 0 0 0 3px rgba(71,90,120,.15);
        }
    </style>
</head>

<body class="flex items-center justify-center">

    <div class="background"></div>

    <main class="relative z-10 w-full max-w-3xl px-6">

        <!-- Logo -->
        <div class="text-center mb-8">

            <div class="flex items-center justify-center gap-2 mb-7">
                <div class="text-4xl">⚡</div>

                <h1 class="text-4xl font-bold tracking-tight">
                    dogeub
                </h1>
            </div>

            <!-- Search -->
            <form id="proxy-form"
                  class="search-box flex items-center rounded-full px-5 py-2 w-full max-w-xl mx-auto">

                <span class="text-gray-400 text-lg mr-3">
                    🔍
                </span>

                <input
                    type="text"
                    id="url-input"
                    placeholder="Search Google or type URL"
                    class="flex-1 bg-transparent outline-none text-white placeholder-gray-500 text-sm"
                    autocomplete="off"
                >

                <button
                    type="submit"
                    class="text-gray-400 hover:text-white transition text-lg">
                    ↵
                </button>

            </form>
        </div>


        <!-- Shortcut Apps -->
        <div class="flex justify-center gap-7 flex-wrap mt-8">

            <!-- Google -->
            <div
                class="text-center cursor-pointer"
                onclick="launchApp('https://google.com')">

                <div class="app-button mx-auto">
                    <span>🌐</span>
                </div>

                <p class="text-xs text-gray-400 mt-2">
                    Google
                </p>
            </div>


            <!-- Facebook -->
            <div
                class="text-center cursor-pointer"
                onclick="launchApp('https://facebook.com')">

                <div class="app-button mx-auto">
                    <span>f</span>
                </div>

                <p class="text-xs text-gray-400 mt-2">
                    Facebook
                </p>
            </div>


            <!-- Chrome -->
            <div
                class="text-center cursor-pointer"
                onclick="launchApp('https://google.com/chrome')">

                <div class="app-button mx-auto">
                    <span>🌈</span>
                </div>

                <p class="text-xs text-gray-400 mt-2">
                    Chrome
                </p>
            </div>


            <!-- GitHub -->
            <div
                class="text-center cursor-pointer"
                onclick="launchApp('https://github.com')">

                <div class="app-button mx-auto">
                    <span>◉</span>
                </div>

                <p class="text-xs text-gray-400 mt-2">
                    GitHub
                </p>
            </div>


            <!-- Home -->
            <div
                class="text-center cursor-pointer"
                onclick="window.location.href='/'">

                <div class="app-button mx-auto">
                    <span>⌂</span>
                </div>

                <p class="text-xs text-gray-400 mt-2">
                    Home
                </p>
            </div>

        </div>

    </main>


    <script>

        /*
         * Put your actual backend/proxy URL here.
         *
         * Example:
         * const BACKEND_PROXY_URL = "https://your-project.vercel.app/";
         */
        const BACKEND_PROXY_URL = "https://vercel.app/";


        function launchApp(targetUrl) {

            const win = window.open("about:blank", "_blank");

            if (!win) {
                alert(
                    "Pop-up blocked! Please allow pop-ups for this website."
                );
                return;
            }

            win.document.body.style.margin = "0";
            win.document.body.style.height = "100vh";
            win.document.body.style.overflow = "hidden";
            win.document.body.style.background = "#000";

            const iframe = win.document.createElement("iframe");

            iframe.style.border = "none";
            iframe.style.width = "100%";
            iframe.style.height = "100%";

            /*
             * Keep this only if your backend actually
             * expects Base64 encoded URLs.
             */
            iframe.src =
                BACKEND_PROXY_URL +
                btoa(targetUrl);

            win.document.body.appendChild(iframe);
        }


        /*
         * Search
         */
        document
            .getElementById("proxy-form")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                let input =
                    document
                        .getElementById("url-input")
                        .value
                        .trim();

                if (!input) return;


                /*
                 * If the user typed a normal search,
                 * search Google.
                 */
                if (
                    input.includes(" ") ||
                    !input.includes(".")
                ) {

                    input =
                        "https://www.google.com/search?q=" +
                        encodeURIComponent(input);

                }

                /*
                 * Add HTTPS when the user enters
                 * example.com
                 */
                else if (
                    !input.startsWith("http://") &&
                    !input.startsWith("https://")
                ) {

                    input = "https://" + input;

                }


                launchApp(input);

            });

    </script>

</body>
</html>
